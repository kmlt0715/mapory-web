<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try { const t = localStorage.getItem('mp_theme'); if (t && t !== 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<title>Mapory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<style>
  /* 테마: 다크(기본) · 라이트 · 우주 */
  :root {
    --bg: #1A222D; --panel: #141B24; --field: #1D2733; --line: #3A4758; --grid: #2A3544;
    --amber: #F5B041; --amber-dark: #3A2C10; --amber-text: #FFD27A; --on-amber: #1A1408;
    --txt: #F3EFE6; --sub: #C9D2DD; --green: #5FD3A2; --sky: #7FB6F2;
    --float: rgba(20,27,36,.95); --tipbg: #0B1017; --stage: #0B1017; --mapbg: #070A10; --goal: rgba(255,255,255,.35); --shadow: rgba(0,0,0,.35);
    color-scheme: dark;
  }
  :root[data-theme=light] {
    --bg: #F3F4F6; --panel: #FFFFFF; --field: #EEF1F5; --line: #D3D9E1; --grid: #E2E7ED;
    --amber: #F0A02A; --amber-dark: #FDEFD3; --amber-text: #8A5A06; --on-amber: #241602;
    --txt: #1A222D; --sub: #556070; --green: #23955A; --sky: #3D7FD6;
    --float: rgba(255,255,255,.96); --tipbg: #FFFFFF; --stage: #DCE2E9; --mapbg: #E8ECF0; --goal: rgba(26,34,45,.35); --shadow: rgba(26,34,45,.12);
    color-scheme: light;
  }
  :root[data-theme=space] {
    --bg: #0D1026; --panel: #151938; --field: #1D2248; --line: #363C7A; --grid: #252A58;
    --amber: #FFB86B; --amber-dark: #3B2A4F; --amber-text: #FFD1A1; --on-amber: #1C1030;
    --txt: #EEF0FF; --sub: #B7BCE6; --green: #6EE7B7; --sky: #8FB8FF;
    --float: rgba(21,25,56,.95); --tipbg: #0A0C1F; --stage: #080A1C; --mapbg: #05061A; --goal: rgba(238,240,255,.35); --shadow: rgba(0,0,0,.45);
    color-scheme: dark;
  }
  :root[data-theme=space] body { background: radial-gradient(900px 500px at 85% -10%, #2A2366 0%, transparent 60%), radial-gradient(700px 400px at -10% 110%, #3B1F5C 0%, transparent 60%), var(--bg); background-attachment: fixed; }
  :root[data-theme=space] nav { background: rgba(13,16,38,.7); }
  .card, .tile, .badge, .fun { box-shadow: 0 1px 2px var(--shadow); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* 로그인 */
  #login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--panel); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 14px; }
  .login-card h1 { margin: 0; font-size: 30px; color: var(--amber); }
  .login-card p { margin: 0 0 6px; color: var(--sub); font-size: 14px; line-height: 1.6; }
  label { font-size: 13px; color: var(--sub); display: flex; flex-direction: column; gap: 6px; }
  input[type=email], input[type=password], input[type=date], select {
    height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); color: var(--txt); font-size: 15px; font-family: inherit; }
  input[type=date], select { height: 40px; font-size: 14px; padding: 0 10px; }
  .btn { height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--field); color: var(--txt); font-size: 14px; padding: 0 16px; white-space: nowrap; }
  .btn.primary { background: var(--amber); border-color: var(--amber); color: var(--on-amber); font-weight: 700; }
  .btn.on { background: var(--amber-dark); border-color: var(--amber); color: var(--amber-text); font-weight: 700; }
  .err { color: #FF9C8A; font-size: 13px; min-height: 18px; }

  /* 앱 틀 */
  #app { height: 100%; display: grid; grid-template-columns: 210px 1fr; }
  nav { background: var(--panel); display: flex; flex-direction: column; padding: 20px 12px; gap: 4px; }
  nav .brand { font-size: 22px; font-weight: 800; color: var(--amber); padding: 4px 12px 18px; }
  nav .brand small { display: block; font-size: 12px; color: var(--sub); font-weight: 500; margin-top: 4px; }
  nav button { text-align: left; background: transparent; border: 0; color: var(--sub); font-size: 15px; padding: 12px; border-radius: 12px; min-height: 44px; }
  nav button[aria-current=page] { background: var(--amber-dark); color: var(--amber-text); font-weight: 700; }
  nav .spacer { flex: 1; }
  nav .who { font-size: 12px; color: var(--sub); padding: 0 12px 8px; word-break: break-all; }
  main { position: relative; overflow: hidden; }
  .page { position: absolute; inset: 0; overflow: auto; }
  .scroll { max-width: 1240px; margin: 0 auto; padding: 28px 28px 60px; }
  h2 { margin: 0 0 18px; font-size: 26px; }
  h3 { margin: 0; font-size: 16px; }
  .muted { color: var(--sub); font-size: 13px; }

  /* 지도 공통 */
  .mapbox { position: absolute; inset: 0; background: var(--mapbg); }
  .fog { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .float { position: absolute; z-index: 2; background: var(--float); box-shadow: 0 4px 18px var(--shadow); border-radius: 18px; padding: 14px; }
  #mapPanel { top: 16px; left: 16px; width: 340px; display: flex; flex-direction: column; gap: 12px; }
  .seg { display: flex; gap: 6px; background: var(--field); border-radius: 12px; padding: 4px; }
  .seg button { flex: 1; height: 38px; border: 0; border-radius: 9px; background: transparent; color: var(--sub); font-size: 14px; }
  .seg button[aria-pressed=true] { background: var(--amber); color: var(--on-amber); font-weight: 700; }
  .range { display: flex; gap: 8px; align-items: center; }
  .ychips { display: flex; gap: 6px; flex-wrap: wrap; }
  .ychips button { height: 30px; border-radius: 15px; border: 1px solid var(--line); background: var(--field); color: var(--sub); padding: 0 11px; font-size: 12px; }
  .ychips button[aria-pressed=true] { border-color: var(--amber); background: var(--amber-dark); color: var(--amber-text); font-weight: 700; }
  .range input { flex: 1; min-width: 0; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 11px; color: var(--sub); }
  .stat.accent b { color: var(--amber); }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tools .btn { height: 40px; font-size: 13px; padding: 0 8px; }
  .fogPick { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--sub); }
  .fogPick button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  .fogPick button[aria-pressed=true] { border-color: var(--amber); }

  /* 추억 핀 */
  .pin { width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2.5px solid var(--amber); display: grid; place-items: center; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.35); padding: 0; }
  .pin.plain { width: 22px; height: 22px; background: var(--amber); border-color: var(--panel); }
  .pin.photo { width: 56px; height: 56px; border: 3px solid #fff; overflow: hidden; background: var(--panel); }
  .pin.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .maplibregl-popup-content { background: var(--panel); color: var(--txt); border-radius: 14px; padding: 12px; font-family: inherit; max-width: 260px; }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--sub); font-size: 18px; width: 32px; height: 32px; }
  .pop img { width: 100%; border-radius: 10px; margin-top: 8px; display: block; }
  .pop .t { font-weight: 700; font-size: 15px; padding-right: 22px; }
  .pop .d { color: var(--sub); font-size: 12px; margin-top: 2px; }
  .pop .b { font-size: 13px; margin-top: 6px; line-height: 1.5; white-space: pre-wrap; max-height: 120px; overflow: auto; }
  .pop .link { margin-top: 8px; background: none; border: 0; color: var(--amber-text); padding: 4px 0; font-size: 13px; }

  /* 타임랩스 */
  #tlBar { left: 50%; bottom: 28px; transform: translateX(-50%); width: min(720px, calc(100% - 40px)); display: flex; flex-direction: column; gap: 10px; }
  #tlBar .top { display: flex; align-items: baseline; gap: 14px; }
  #tlDate { font-size: 30px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; }
  #tlInfo { color: var(--sub); font-size: 14px; flex: 1; }
  #tlBar .ctl { display: flex; gap: 8px; align-items: center; }
  #tlRange { flex: 1; accent-color: var(--amber); height: 30px; }
  #globeHint { top: 16px; right: 16px; font-size: 13px; color: var(--sub); max-width: 260px; }

  /* 여정 영상 */
  #jPanel { top: 16px; left: 16px; width: 350px; max-height: calc(100% - 32px); overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 12px; }
  #jPanel h3 { font-size: 18px; }
  #jPanel label { min-width: 0; }
  #jPanel select, #jPanel label input[type=text] { width: 100%; min-width: 0; }
  #jPanel label input[type=text] { height: 40px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); color: var(--txt); font-size: 14px; font-family: inherit; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chk { flex-direction: row; align-items: center; gap: 8px; color: var(--txt); font-size: 14px; min-height: 36px; }
  .chk input { width: 20px; height: 20px; accent-color: var(--amber); }
  #jPresets { display: flex; gap: 6px; flex-wrap: wrap; }
  #jPresets .btn { height: 34px; font-size: 12px; padding: 0 10px; border-radius: 17px; }
  #jCols { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--sub); }
  #jCols button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  #jCols button[aria-pressed=true] { border-color: #fff; }
  #jTitle { position: absolute; z-index: 3; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.93); color: #111; border-radius: 18px; padding: 12px 28px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,.25); pointer-events: none; white-space: nowrap; }
  #jTitle b { display: block; font-size: 24px; font-weight: 800; }
  #jTitle span { font-size: 14px; color: #555; }
  #jCtl { left: 50%; bottom: 28px; transform: translateX(-50%); width: min(560px, calc(100% - 40px)); display: flex; gap: 12px; align-items: center; }
  #jSeek { flex: 1; accent-color: var(--amber); height: 30px; cursor: pointer; }
  #jCtl .track { flex: 1; height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
  #jCtl .track i { display: block; height: 100%; width: 0; background: var(--amber); }

  /* 비교 */
  #page-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--panel); }
  #page-compare.hidden { display: none; }
  .cmpSide { position: relative; overflow: hidden; }
  .cmpHead { top: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 10px; }
  .cmpHead .row1 { display: flex; gap: 8px; align-items: center; }
  .cmpHead .tag { font-weight: 800; font-size: 15px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: var(--on-amber); flex: none; }
  #cmpPreset { position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  /* 카드 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .big { font-size: 32px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--amber); border-radius: 4px; min-width: 2px; }
  .bar.sky i { background: var(--sky); } .bar.green i { background: var(--green); }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
  .row .v { color: var(--sub); white-space: nowrap; }
  section { margin-top: 32px; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .badge { background: var(--panel); border-radius: 18px; padding: 14px 8px; text-align: center; border: 1px solid transparent; }
  .badge.got { border-color: var(--amber); }
  .badge .e { font-size: 30px; }
  .badge:not(.got) .e { opacity: .3; }
  .badge b { display: block; font-size: 13px; margin-top: 4px; }
  .badge.got b { color: var(--amber-text); }
  .badge span { font-size: 11px; color: var(--sub); }

  /* 대시보드 */
  nav .brand { background: none; border: 0; text-align: left; cursor: pointer; font-family: inherit; padding: 4px 12px 14px; }
  nav .brand:hover { opacity: .85; }
  .hero { --txt: #F3EFE6; --sub: #C9D2DD; color: var(--txt); position: relative; overflow: hidden; border-radius: 26px; padding: 30px 34px 26px; background: radial-gradient(1200px 400px at 80% -20%, #2B3B7A 0%, transparent 60%), radial-gradient(700px 300px at 0% 120%, #3A1F5C 0%, transparent 60%), #0A0F1E; }
  .stars, .stars::after { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 120px, #cfe, transparent), radial-gradient(1.2px 1.2px at 160px 60px, #fff, transparent), radial-gradient(1px 1px at 230px 170px, #ffd, transparent), radial-gradient(1.4px 1.4px at 300px 40px, #fff, transparent); background-size: 340px 220px; opacity: .55; animation: twinkle 4s ease-in-out infinite alternate; }
  .stars::after { content: ''; background-size: 270px 190px; background-position: 60px 90px; animation-delay: 2s; }
  @keyframes twinkle { from { opacity: .25; } to { opacity: .75; } }
  .heroTop { position: relative; display: grid; grid-template-columns: 260px 1fr; gap: 30px; align-items: center; }
  .globe { width: 260px; height: 260px; filter: drop-shadow(0 0 30px rgba(80,150,255,.35)); }
  .globe .lands { animation: spin 26s linear infinite; }
  @keyframes spin { to { transform: translateX(-260px); } }
  .lapRing { transition: stroke-dasharray 1.6s cubic-bezier(.2,.8,.2,1); }
  .kick { font-size: 12px; letter-spacing: .3em; color: #9FB4FF; font-weight: 700; }
  .heroBig { font-size: 54px; font-weight: 900; letter-spacing: -.02em; line-height: 1.1; margin: 6px 0 10px; }
  .heroBig b { color: var(--amber); font-variant-numeric: tabular-nums; }
  .heroTxt p { color: #C9D2DD; font-size: 15px; line-height: 1.6; margin: 0 0 14px; }
  .heroTxt p b { color: #fff; }
  .moonRow { display: flex; align-items: center; gap: 10px; }
  .moonRow .ico { font-size: 30px; }
  .moonRow .moon { filter: drop-shadow(0 0 12px rgba(255,255,220,.6)); }
  .moonTrack { position: relative; flex: 1; height: 10px; border-radius: 5px; background: rgba(255,255,255,.12); }
  .moonTrack .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: linear-gradient(90deg, #7FB6F2, #F5B041); transition: width 1.6s cubic-bezier(.2,.8,.2,1); }
  .moonTrack .rocket { position: absolute; top: 50%; left: 0; transform: translate(-50%, -55%) rotate(45deg); font-size: 22px; transition: left 1.6s cubic-bezier(.2,.8,.2,1); animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { margin-top: -4px; } }
  .solar { position: relative; height: 150px; margin: 40px 24px 0 34px; }
  .orbitLine { position: absolute; left: 0; right: 0; top: 74px; height: 2px; background: linear-gradient(90deg, rgba(127,182,242,.7), rgba(255,183,3,.6) 55%, rgba(63,111,217,.5)); }
  .earthStart { position: absolute; left: -30px; top: 58px; font-size: 30px; }
  .planet { position: absolute; top: 75px; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: default; }
  .planet svg { display: block; transition: transform .2s; }
  .planet:hover svg { transform: scale(1.18); }
  .planet b { position: absolute; top: calc(50% + 26px); font-size: 12px; white-space: nowrap; color: #E6ECF5; }
  .planet span { position: absolute; top: calc(50% + 42px); font-size: 10px; white-space: nowrap; color: #8E9BB0; }
  .planet.up b { top: auto; bottom: calc(50% + 40px); }
  .planet.up span { top: auto; bottom: calc(50% + 26px); }
  .planet.got b { color: var(--amber); }
  .planet.got b::before { content: '✓ '; }
  .me { position: absolute; top: 100px; left: 0; transform: translateX(-50%); font-size: 24px; transition: left 1.8s cubic-bezier(.2,.8,.2,1); animation: bob 1.4s ease-in-out infinite; text-align: center; }
  .me span { display: block; font-size: 10px; color: var(--amber); font-weight: 700; margin-top: -2px; }
  .heroNext { position: relative; margin: 18px 0 0; font-size: 14px; color: #C9D2DD; }
  .heroNext b { color: var(--amber); }
  .funGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
  .fun { background: var(--panel); border-radius: 18px; padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 2px; transition: transform .15s; }
  .fun:hover { transform: translateY(-3px); }
  .fun .e { font-size: 34px; line-height: 1.1; margin-bottom: 6px; }
  .fun b { font-size: 26px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; }
  .fun small { font-size: 13px; color: var(--sub); margin-left: 3px; }
  .fun span { font-size: 13px; color: var(--txt); }
  .fun em { font-style: normal; font-size: 11px; color: var(--sub); }
  @media (max-width: 900px) { .heroTop { grid-template-columns: 1fr; justify-items: center; } .heroBig { font-size: 40px; } }
  @media (prefers-reduced-motion: reduce) { .globe .lands, .stars, .stars::after, .rocket, .me { animation: none !important; } }
  #healthBox { display: flex; flex-direction: column; gap: 14px; }
  .hHead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .hHead h2 { margin: 0; }
  .hTop { display: grid; grid-template-columns: 1.15fr 1fr 1.1fr; gap: 14px; }
  .hToday { flex-direction: row; align-items: center; gap: 18px; }
  .hToday > div { display: flex; flex-direction: column; gap: 6px; }
  .lvBar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; font-size: 10px; text-align: center; }
  .lvBar span { background: var(--grid); border-radius: 6px; padding: 6px 2px; color: var(--sub); }
  .hNums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .hNums div { display: flex; flex-direction: column; } .hNums span { font-size: 12px; color: var(--sub); } .hNums b { font-size: 18px; } .hNums small { font-size: 11px; color: var(--sub); }
  #healthBox .months { gap: 4px; } #healthBox .months .m span { font-size: 10px; white-space: nowrap; } #healthBox .months .m b { font-size: 9px; }
  .hMid { display: grid; grid-template-columns: 1.5fr 1fr 1.1fr; gap: 14px; }
  .hBars { position: relative; display: flex; align-items: flex-end; gap: 3px; height: 170px; }
  .hb { flex: 1; height: 100%; display: flex; align-items: flex-end; }
  .hb i { display: block; width: 100%; border-radius: 3px 3px 0 0; min-height: 0; }
  .goalLine { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--goal); pointer-events: none; }
  .goalLine span { position: absolute; right: 0; top: -16px; font-size: 10px; color: var(--sub); }
  @media (max-width: 1100px) { .hTop, .hMid { grid-template-columns: 1fr; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border-radius: 18px; padding: 16px 18px; }
  .tile span { font-size: 12px; color: var(--sub); }
  .tile b { display: block; font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile b.a { color: var(--amber); }
  .tile small { display: block; font-size: 12px; color: var(--sub); margin-top: 4px; }
  .dash2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-top: 14px; }
  .cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto); grid-auto-columns: minmax(0, 1fr); gap: 3px; }
  .cal i { aspect-ratio: 1; border-radius: 3px; background: var(--grid); display: block; cursor: pointer; }
  .calMonths { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; font-size: 11px; color: var(--sub); height: 16px; }
  .calMonths span { white-space: nowrap; overflow: visible; }

function decode(str) {
  const out = []; let i = 0, lat = 0, lon = 0;
  while (i < str.length) {
    for (const k of [0, 1]) {
      let r = 0, s = 0, b;
      do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20 && i < str.length);

  } else if (b) {

// ───────── 3D 지구본 ─────────
let globeOn = false, spinning = false;
// 날짜 번호 (타임랩스에서 '그날까지'만 보이게 거르는 데 씀)
let dayNo = {};
function trackGeoJSON() {
  const list = [...new Set(segs.map(s => s.day))].sort(); dayNo = Object.fromEntries(list.map((d, i) => [d, i]));
  return { type: 'FeatureCollection', features: segs.filter(s => s.ll.length > 1).map(s => ({ type: 'Feature', properties: { i: dayNo[s.day] }, geometry: { type: 'LineString', coordinates: s.ll } })) };
}
function globeFilter(upto) {
  if (!map.getLayer('trk-glow')) return;
  const f = upto == null ? null : ['<=', ['get', 'i'], upto];
  for (const id of ['trk-glow', 'trk-core', 'trk-halo', 'trk-dot']) map.setFilter(id, f);
  map.setFilter('trk-now', upto == null ? ['==', ['get', 'i'], -1] : ['==', ['get', 'i'], upto]);
}
function setGlobe(on) {
  if (!map._ready) return;
  globeOn = on;
  $('bGlobe').setAttribute('aria-pressed', on); $('bGlobe').classList.toggle('on', on);
  $('globeHint').classList.toggle('hidden', !on);
  if (on) {
    if (tl) stopTimelapse();
    setTimeout(() => { if (!tl) globeFilter(null); }, 0);
    fog.off = true; fog.draw();
    map.setProjection({ type: 'globe' });
    try { map.setSky({ 'sky-color': '#0B1A33', 'horizon-color': '#3E6FB8', 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] }); } catch (e) {}
    if (!map.getSource('trk')) {
      // 지구본 크기에서는 짧은 길이 안 보이므로, 다녀간 날마다 빛나는 점을 찍습니다.
      const trk = trackGeoJSON();
      const dots = { type: 'FeatureCollection', features: segs.filter((s, i) => i % 2 === 0).map(s => ({ type: 'Feature', properties: { i: dayNo[s.day] }, geometry: { type: 'Point', coordinates: s.ll[0] } })) };
      map.addSource('trk-pt', { type: 'geojson', data: dots });
      map.addLayer({ id: 'trk-halo', type: 'circle', source: 'trk-pt', maxzoom: 9, paint: { 'circle-color': '#F5B041', 'circle-radius': ['interpolate', ['linear'], ['zoom'], 0, 7, 8, 16], 'circle-blur': 1, 'circle-opacity': 0.45 } });
      map.addLayer({ id: 'trk-dot', type: 'circle', source: 'trk-pt', maxzoom: 9, paint: { 'circle-color': '#FFE2A8', 'circle-radius': 2.2 } });
      map.addSource('trk', { type: 'geojson', data: trk });
      map.addLayer({ id: 'trk-glow', type: 'line', source: 'trk', paint: { 'line-color': '#F5B041', 'line-width': 8, 'line-blur': 6, 'line-opacity': 0.55 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
      map.addLayer({ id: 'trk-core', type: 'line', source: 'trk', paint: { 'line-color': '#FFE2A8', 'line-width': 2.2 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
      map.addLayer({ id: 'trk-now', type: 'line', source: 'trk', filter: ['==', ['get', 'i'], -1], paint: { 'line-color': '#FFFFFF', 'line-width': 5 }, layout: { 'line-cap': 'round', 'line-join': 'round' } });
    } else {
      for (const id of ['trk-glow', 'trk-core', 'trk-halo', 'trk-dot', 'trk-now']) map.setLayoutProperty(id, 'visibility', 'visible');
      globeFilter(null);
    }
    const b = boundsOf(() => true);
    const center = b ? [(b[0][0] + b[1][0]) / 2, (b[0][1] + b[1][1]) / 2] : [127, 36];
    map.easeTo({ center, zoom: innerHeight > 800 ? 2.1 : 1.7, duration: 2200 });
    setTimeout(() => { if (globeOn) startSpin(); }, 2400);
  } else {
    stopSpin();
    map.setProjection({ type: 'mercator' });
    for (const id of ['trk-glow', 'trk-core', 'trk-halo', 'trk-dot', 'trk-now']) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none');
    fog.off = false; fog.draw(); fitAll();
  }
}
function startSpin() {
  spinning = true;
  const step = () => { if (!spinning || !globeOn) return; const c = map.getCenter(); if (map.getZoom() < 3) map.jumpTo({ center: [c.lng + 0.12, c.lat] }); requestAnimationFrame(step); };

function stopSpin() { spinning = false; }
$('bGlobe').onclick = () => setGlobe(!globeOn);

// ───────── 나란히 비교 ─────────
let cmp = null;
function initCompare() {
  const side = (id, key) => { const m = makeMap(id); const f = new Fog(m); f.dim = true; return { map: m, fog: f, key }; };
  cmp = { A: side('mapA', 'a'), B: side('mapB', 'b'), sync: false };
  // 한쪽을 움직이면 다른 쪽도 같은 곳을 보여 줍니다.
  for (const [me, other] of [[cmp.A, cmp.B], [cmp.B, cmp.A]]) {
    me.map.on('move', (e) => { if (cmp.sync || !e.originalEvent) return; cmp.sync = true; other.map.jumpTo({ center: me.map.getCenter(), zoom: me.map.getZoom() }); cmp.sync = false; });
  }
  for (const s of [cmp.A, cmp.B]) for (const which of ['From', 'To']) $(s.key + which).onchange = () => applyCompare();
  document.querySelectorAll('#cmpPreset button').forEach(b => b.onclick = () => preset(b.dataset.p));
  cmp.A.map.on('load', () => preset('month'));
}
function preset(p) {
  const t = new Date(), y = t.getFullYear(), mo = t.getMonth();
  const D = (a, b, c) => dayOf(new Date(a, b, c).getTime());
  let a, b;
  if (p === 'year') { a = [D(y, 0, 1), D(y, 11, 31)]; b = [D(y - 1, 0, 1), D(y - 1, 11, 31)]; }
  else if (p === 'week') { const wd = (t.getDay() + 6) % 7; a = [D(y, mo, t.getDate() - wd), D(y, mo, t.getDate() - wd + 6)]; b = [D(y, mo, t.getDate() - wd - 7), D(y, mo, t.getDate() - wd - 1)]; }
  else { a = [D(y, mo, 1), D(y, mo + 1, 0)]; b = [D(y, mo - 1, 1), D(y, mo, 0)]; }
  $('aFrom').value = a[0]; $('aTo').value = a[1]; $('bFrom').value = b[0]; $('bTo').value = b[1];
  document.querySelectorAll('#cmpPreset button').forEach(x => x.classList.toggle('on', x.dataset.p === p));
  applyCompare(true);
}
function applyCompare(fit) {
  if (!cmp) return;
  let all = [];
  for (const s of [cmp.A, cmp.B]) {
    let f = $(s.key + 'From').value, t = $(s.key + 'To').value; if (f > t) [f, t] = [t, f];
    s.fog.show = (d) => d >= f && d <= t; s.fog.draw();
    const r = sumRange(f, t);
    $(s.key + 'Stats').innerHTML = `<div class="stat accent"><b>${fmtArea(r.area)}</b><span>새로 밝힘</span></div><div class="stat"><b>${fmtDist(r.dist)}</b><span>이동 · ${r.n}일</span></div><div class="stat"><b>${r.mem}개</b><span>추억</span></div>`;
    (s.pins || []).forEach(m => m.remove());
    s.pins = mems.filter(m => s.fog.show(dayOf(m.ts))).map(m => new maplibregl.Marker({ element: pinFor(m) }).setLngLat([m.lon, m.lat]).setPopup(new maplibregl.Popup({ offset: 20 }).setHTML(memPopup(m))).addTo(s.map));
    all.push(s.fog.show);
  }
  if (fit) {
    const b = boundsOf((d) => all.some(f => f(d))) || boundsOf(() => true);
    if (b) { cmp.sync = true; for (const s of [cmp.A, cmp.B]) s.map.fitBounds(b, { padding: 70, maxZoom: 15, duration: 0 }); cmp.sync = false; }
  }
}

// ───────── 한눈에 (대시보드) ─────────
function renderHome() {
  const today = dayOf(Date.now());
  const t = new Date(), y = t.getFullYear(), mo = t.getMonth();
  const mStart = dayOf(new Date(y, mo, 1).getTime()), pmStart = dayOf(new Date(y, mo - 1, 1).getTime()), pmEnd = dayOf(new Date(y, mo, 0).getTime());
  const cur = sumRange(mStart, today), prev = sumRange(pmStart, pmEnd), all = sumRange('0000', '9999');
  const S = summary || {};
  const dplus = S.startTs ? Math.floor((Date.now() - S.startTs) / 864e5) + 1 : days.length;
  const diff = (a, b) => b > 0 ? (a >= b ? '▲ ' : '▼ ') + Math.round(Math.abs(a - b) / b * 100) + '% (지난달 대비)' : '';
  let h = spaceHero() + `<h2 style="margin-top:30px">요즘의 나</h2><div class="tiles">
    <div class="tile"><span>함께한 날</span><b class="a">D+${dplus}</b><small>기록한 날 ${days.length}일</small></div>
    <div class="tile"><span>지구에서 밝힌 곳</span><b class="a">${fmtPct(S.earthPct ?? all.area / 510072000 * 100)}</b><small>${fmtArea(S.area ?? all.area)}</small></div>
    <div class="tile"><span>이번 달 이동</span><b>${fmtDist(cur.dist)}</b><small>${diff(cur.dist, prev.dist)}</small></div>
    <div class="tile"><span>이번 달 새로 밝힘</span><b>${fmtArea(cur.area)}</b><small>${diff(cur.area, prev.area)}</small></div>
    <div class="tile"><span>남긴 추억</span><b>${mems.length}개</b><small>이번 달 ${cur.mem}개</small></div>
  </div>`;

  // 1년 활동 달력 (잔디)
  const byDay = Object.fromEntries(days.map(d => [d.day, d]));
  const end = new Date(); const start = new Date(end); start.setDate(start.getDate() - 364); start.setDate(start.getDate() - start.getDay());
  const vals = days.map(total).filter(v => v > 0).sort((a, b) => a - b);
  const q = (p) => vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * p))] : 1;
  const cuts = [q(0.25), q(0.5), q(0.75)];
  const shade = (v) => v <= 0 ? null : v <= cuts[0] ? 0.28 : v <= cuts[1] ? 0.5 : v <= cuts[2] ? 0.75 : 1;
  let cells = '', monthsRow = '', lastM = -1, col = 0;
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 0) { const m = d.getMonth(); monthsRow += `<span>${m !== lastM ? (m + 1) + '월' : ''}</span>`; lastM = m; col++; }
    const k = dayOf(d.getTime()), r = byDay[k], v = r ? total(r) : 0, s = shade(v);
    cells += `<i ${s ? `style="background:rgba(245,176,65,${s})"` : ''} data-day="${k}" data-tip="${fmtDayLabel(k)}<br>${r ? '이동 ' + fmtDist(v) + (r.steps ? ' · 걸음 ' + nf.format(r.steps) : '') : '기록 없음'}"></i>`;
  }
  const legend = `<div class="legend">적음 <i style="background:var(--grid)"></i>${[0.28, 0.5, 0.75, 1].map(a => `<i style="background:rgba(245,176,65,${a})"></i>`).join('')} 많음</div>`;

  // 요일×시간대
  let heat = '';
  if (S.week) {
    const mx = Math.max(1, ...S.week.flat());
    heat = `<div class="heat"><span></span>${Array.from({ length: 24 }, (_, hh) => `<span class="h">${hh % 6 === 0 ? hh : ''}</span>`).join('')}`;
    for (const w of [1, 2, 3, 4, 5, 6, 0]) {
      heat += `<span>${DOW[w]}</span>` + S.week[w].map((v, hh) => `<i style="${v > 0 ? `background:rgba(127,182,242,${(0.15 + 0.85 * Math.sqrt(v / mx)).toFixed(2)})` : ''}" data-tip="${DOW[w]}요일 ${hh}시~${hh + 1}시<br>누적 ${fmtDist(v)}"></i>`).join('');
    }
    heat += `</div>`;
    let best = [0, 0, 0]; S.week.forEach((r, w) => r.forEach((v, hh) => { if (v > best[2]) best = [w, hh, v]; }));
    heat += `<p class="muted">가장 많이 움직이는 때: <b style="color:var(--txt)">${DOW[best[0]]}요일 ${best[1]}시대</b></p>`;
  } else heat = `<p class="muted">앱을 최신 버전으로 업데이트하고 동기화하면 나타나요.</p>`;

  // 최근 12개월 이동
  const ms = [];
  for (let i = 11; i >= 0; i--) { const a = new Date(y, mo - i, 1), b = new Date(y, mo - i + 1, 0); const r = sumRange(dayOf(a.getTime()), dayOf(b.getTime())); ms.push([a.getMonth() + 1, r.dist, a.getFullYear()]); }

  h += `<div class="dash2">
    <div class="card"><div class="row"><h3>1년 활동 달력</h3>${legend}</div><div><div class="calMonths">${monthsRow}</div><div class="cal" id="cal">${cells}</div></div><span class="muted">칸을 누르면 그날 다닌 길을 지도에서 보여줘요.</span></div>

  </div>

    <div class="card"><h3>이번 달 vs 지난달</h3>
      <div class="row"><span>이동 거리</span><span class="v">${fmtDist(cur.dist)} / ${fmtDist(prev.dist)}</span></div>${bar(prev.dist ? cur.dist / Math.max(cur.dist, prev.dist) : 1)}
      <div class="row"><span>새로 밝힌 영역</span><span class="v">${fmtArea(cur.area)} / ${fmtArea(prev.area)}</span></div>${bar(prev.area ? cur.area / Math.max(cur.area, prev.area) : 1, 'sky')}
      <div class="row"><span>기록한 날</span><span class="v">${cur.n}일 / ${prev.n}일</span></div>
      <div class="row"><span>추억</span><span class="v">${cur.mem}개 / ${prev.mem}개</span></div>
      <button class="btn" id="goCompare">지도로 나란히 비교하기 →</button></div>
  </div>`;

  // 최근 추억 띠
  const recent = [...mems].sort((a, b) => b.ts - a.ts).slice(0, 14);
  if (recent.length) h += `<section><h2 style="font-size:20px">최근 추억</h2><div class="strip">${recent.map(memCard).join('')}</div></section>`;
  $('homeBox').innerHTML = h;
  animateHome();
  $('cal').addEventListener('click', (e) => { const i = e.target.closest('i[data-day]'); if (i && byDay[i.dataset.day]) { go('map'); setView('range', i.dataset.day, i.dataset.day); } });
  $('goCompare').onclick = () => go('compare');
}

/** 앱 기록 + 구글 타임라인(앱 기록이 없는 날) 거리 합계와 최근 1년 하루 평균 */
function allTotals() {
  const have = new Set(days.map(d => d.day)); let walk = 0, tot = 0, plane = 0, recent = 0;
  const since = addDays(dayOf(Date.now()), -365);
  const add = (d) => { walk += d.dist_walk; plane += d.dist_plane; const t = total(d); tot += t; if (d.day >= since) recent += t; };
  days.forEach(add); extra.filter(e => e.source === 'google' && !have.has(e.day)).forEach(add);

// 시험용 워치 기록 (심박·수면·산소포화도·체성분·운동)
function demoHealth() {
  const out = [], t = new Date(); let w = 72.4;
  const rnd = (k, a) => { const x = Math.sin(k * 12.9898 + a * 78.233) * 43758.5453; return x - Math.floor(x); };
  for (let k = 120; k >= 0; k--) {
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - k), day = dayOf(d.getTime());
    w += (rnd(k, 1) - 0.52) * 0.25;
    const bed = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1, 23, Math.floor(rnd(k, 2) * 80) - 20).getTime();
    const asleep = 330 + Math.floor(rnd(k, 3) * 120), flow = []; let off = 0;
    while (off < asleep) { const cyc = [['light', 25 + rnd(k + off, 4) * 20], ['deep', 10 + rnd(k + off, 5) * 25 * (off < 200 ? 1 : 0.3)], ['light', 15], ['rem', 10 + rnd(k + off, 6) * 20 * (off > 150 ? 1.6 : 0.6)], ['awake', rnd(k + off, 7) * 6]];
      for (const [st, m] of cyc) { const mm = Math.round(m); if (mm < 1) continue; flow.push([off, mm, st]); off += mm; } }
    const sum = (st) => flow.filter(f => f[2] === st).reduce((a, f) => a + f[1], 0);
    const hrH = Array.from({ length: 24 }, (_, h) => Math.round((h < 7 ? 56 : h < 9 ? 72 : h < 19 ? 78 + rnd(k, h) * 14 : 68) + rnd(k, h + 30) * 6));
    const o = { hr: { avg: Math.round(hrH.reduce((a, b) => a + b, 0) / 24), min: 49 + Math.floor(rnd(k, 8) * 5), max: 118 + Math.floor(rnd(k, 9) * 40) }, hrH,
      rhr: 56 + Math.round(rnd(k, 10) * 6 - (120 - k) / 60), hrv: Math.round(32 + rnd(k, 11) * 22), spo2: { avg: 95 + Math.round(rnd(k, 12) * 30) / 10, min: 89 + Math.round(rnd(k, 13) * 5) }, resp: 13 + Math.round(rnd(k, 14) * 40) / 10,
      sleep: { start: bed, end: bed + off * 60000, asleep: off - sum('awake'), inBed: off, deep: sum('deep'), light: sum('light'), rem: sum('rem'), awake: sum('awake'), nap: rnd(k, 15) > 0.85 ? 25 : 0, flow },
      akcal: 380 + Math.round(rnd(k, 16) * 420), kcal: 2050 + Math.round(rnd(k, 17) * 600), floors: Math.round(rnd(k, 18) * 18), };
    if (k % 3 === 0) { o.weight = Math.round(w * 10) / 10; o.fat = Math.round((21.5 + (w - 72) * 0.6 + rnd(k, 19)) * 10) / 10; o.bmr = 1580 + Math.round(rnd(k, 20) * 40); o.lean = Math.round(w * 0.78 * 10) / 10; o.water = Math.round(w * 0.56 * 10) / 10; }
    if (k % 7 === 0) o.bp = { sys: 112 + Math.round(rnd(k, 21) * 18), dia: 72 + Math.round(rnd(k, 22) * 12), n: 1 };
    if (k % 10 === 0) o.vo2 = Math.round((41 + (120 - k) / 60 + rnd(k, 23)) * 10) / 10;
    if (rnd(k, 24) > 0.55) o.ex = [{ t: ['걷기', '달리기', '자전거', '근력 운동', '등산'][Math.floor(rnd(k, 25) * 5)], start: d.getTime() + 18 * 3600e3, min: 25 + Math.round(rnd(k, 26) * 50), title: '' }];
    out.push({ day, data: o });
  }

  return out;
}

  // 속도: 두 점의 시각을 알면 계산 (기록이 끊긴 사이는 모름). 부드럽게 바뀌도록 평균
  let kmh = NaN;
  // 먼 이동(나라·도시 사이)은 기록이 끊겼어도 양쪽 시각을 알면(12시간 안) 평균 속도로 봄 (KTX는 차, 비행기는 비행기)
  if ((!P.gap[i] || (isHop && P.T[i] - P.T[i - 1] < 12 * 3600e3)) && P.T[i] > P.T[i - 1]) kmh = distM(a[1], a[0], b[1], b[0]) / ((P.T[i] - P.T[i - 1]) / 1000) * 3.6;
  if (Number.isFinite(kmh)) J.kmh = J.kmh == null ? kmh : J.kmh + (kmh - J.kmh) * (1 - Math.pow(0.15, dt || 0.016));
  else if (isHop) J.kmh = null;
  const known = J.kmh != null && Number.isFinite(kmh = J.kmh) && Number.isFinite(P.T[i]);
  const mode = known ? (J.kmh < 9 ? 'walk' : J.kmh < 200 ? 'car' : 'plane') : isHop ? 'plane' : null;
  const headF = pointF(head);
  if (jcfg.icon && mode) headF.properties = { icon: 'jm-' + mode };
  if (plane3d) headF.properties = { icon: 'jm-plane' };
  jmap.getSource('j-new').setData({ type: 'FeatureCollection', features: [lines(P, J.oldUpto < 0 ? 0 : J.oldUpto, i - 1, tail), headF] });
  J.spdText = jcfg.spd && known ? `${{ walk: '🚶', car: '🚗', plane: '✈️' }[mode]} ${J.kmh < 10 ? J.kmh.toFixed(1) : Math.round(J.kmh)} km/h` : (jcfg.spd && isHop ? '✈️ 이동 중' : '');
  const km = P.D[i - 1] + (P.D[i] - P.D[i - 1]) * g;
  // 기록된 해발 고도가 있으면 부드럽게 보여 줌
  const a0 = P.A[i - 1], a1 = P.A[i];
  const el = Number.isFinite(a0) && Number.isFinite(a1) ? a0 + (a1 - a0) * g : Number.isFinite(a1) ? a1 : a0;
  if (Number.isFinite(el)) J.el = J.el == null ? el : J.el + (el - J.el) * (1 - Math.pow(0.2, dt || 0.016));
  else if (P.gap[i]) J.el = null;
  const elText = plane3d ? `✈️ 고도 ${nf.format(Math.round(hopAlt * 100) * 100)}m` : J.el != null && !isHop ? `⛰ ${nf.format(Math.round(J.el))}m` : '';
  const [t1, t2] = jTitleText(P, i, km); setJTitle(t1, t2 + (J.spdText ? ' · ' + J.spdText : '') + (elText ? ' · ' + elText : ''));
  if (P.altMax && j3d() && (i - J.wallUpto >= 3 || i < J.wallUpto)) { jmap.getSource('j-wall').setData(wallFC(P, i - 1)); J.wallUpto = i; }
  J.km = km; jProfDraw(km);
  if (!J.dragging) $('jSeek').value = Math.round(J.t / jcfg.dur * 1000);
  $('jTime').textContent = `${fmtT(J.t)} / ${fmtT(jcfg.dur)}`;
  // 카메라: 점을 부드럽게 따라가고, 빨리 움직일 때는 멀리서 봄
  if (jcfg.cam !== 'fixed' && dt > 0) {
    // 3D: 드론처럼 비스듬히. 멀리 날아갈 때는 위에서 내려다보고, 땅에서는 가는 방향으로 천천히 돌아감
    // 비행기: 올라갈수록 창밖을 내다보듯 크게 기울임
    const tp = !j3d() ? 0 : isHop ? 48 + 24 * hopAlt : J.zoom < 7 ? 25 : J.zoom < 10 ? 50 : 66;
    J.pitch += (tp - J.pitch) * (1 - Math.pow(0.35, dt));
    if (plane3d) J.bear += angDiff(J.bear, bearingOf(a, b)) * (1 - Math.pow(0.4, dt));   // 비행 방향을 바라봄
    else if (j3d() && !isHop) {
      if (jcfg.cam === 'auto') J.bear = (J.bear + 3 * dt) % 360;                // 하루 보기: 천천히 한 바퀴
      else if (distM(J.prevHead[1], J.prevHead[0], head[1], head[0]) > 0.3) J.bear += angDiff(J.bear, bearingOf(J.prevHead, head)) * (1 - Math.pow(0.82, dt));
    } else if (!j3d()) J.bear += angDiff(J.bear, 0) * (1 - Math.pow(0.3, dt));
    // 속도는 부드럽게(최근 값 위주 평균) 재고, 동네 안에서는 조금만, 장거리 이동 중에만 크게 멀어집니다.
    const raw = distM(J.prevHead[1], J.prevHead[0], head[1], head[0]) / dt;      // m/초
    J.speed = (J.speed ?? raw) + (raw - (J.speed ?? raw)) * (1 - Math.pow(0.1, dt));
    const lat = Math.max(-80, Math.min(80, head[1]));
    const screenM = 40075016.686 * Math.cos(lat * Math.PI / 180) / 2 ** baseZoom() * (jmap.getCanvas().clientWidth / 512);
    const hopD = P.hop ? P.hop[i] : 0;
    if (hopD && plane3d) {
      // 3D 비행: 지구 전체로 멀리 빠지지 않고, 실제 비행기 높이에서 내려다보는 느낌으로
      // 순항 높이는 화면이 너무 빨리 지나가지 않을 만큼 (초당 화면 폭의 절반쯤 흐르게)
      const legSec = Math.max(1, (P.W[i] - P.W[i - 1]) / P.W[P.n - 1] * jcfg.dur * 0.4);
      const latC = Math.cos(Math.max(-80, Math.min(80, head[1])) * Math.PI / 180);
      const mppWant = (hopD / legSec) / Math.max(200, (jmap.getCanvas().clientWidth || 400) * 0.5);
      const cruise = Math.max(5.5, Math.min(11, Math.log2(40075016.686 * latC / 512 / mppWant)));
      const dest = camZoom(P, i);
      const want = J.hopStart + (dest - J.hopStart) * g;
      J.zoom = want + (Math.min(want, cruise) - want) * hopAlt;
      J.cam = head.slice();
      J.inHop = true;
    } else if (hopD) {
      // 나라를 넘는 이동: 출발지에서 멀어져 지구가 보일 만큼 축소 → 도착지로 다가가며 다시 확대
      const dest = camZoom(P, i);
      const far = Math.max(1.3, Math.min(Math.min(J.hopStart, dest) - 2, zoomForSpan(hopD, (a[1] + b[1]) / 2)));
      const arc = Math.min(sstep(f / 0.3), sstep((1 - f) / 0.3));
      const want = J.hopStart + (dest - J.hopStart) * g;              // 출발 줌 → 도착 줌으로 이어짐
      J.zoom = want - (want - far) * arc;
      J.cam = head.slice();
      J.inHop = true;
    } else {
      if (J.inHop) { J.inHop = false; J.speed = 0; }
      if (jcfg.cam === 'auto') {
        // 하루 범위에 맞춰: 그날 돌아다닌 곳 전체가 보이게 천천히 확대·축소하며 이동
        // 위치는 적당히 따라가고, 확대·축소는 천천히(1초에 최대 0.7단계) 바꿔 어지럽지 않게
        const Z = P.zones[P.zoneOf[i]], k = 1 - Math.pow(0.12, dt), kz = 1 - Math.pow(0.5, dt);
        const tz = zoneZoom(Z), dz = (tz - J.zoom) * kz, lim = 0.7 * dt;
        J.zoom += Math.max(-lim, Math.min(lim, dz));
        // 아직 덜 멀어졌을 때(그날 범위가 다 안 보일 때)는 점을 따라가서 화면 밖으로 나가지 않게
        const aim = J.zoom > tz + 0.4 ? head : Z.c;
        J.cam = [lonWrap(J.cam[0] + lonDiff(J.cam[0], aim[0]) * k), J.cam[1] + (aim[1] - J.cam[1]) * k];
        J.hopStart = J.zoom;
        jCamGo(J.cam);
        J.prevHead = head;
      } else {
      const longHop = distM(a[1], a[0], b[1], b[0]) > 15000;
      const floor = longHop ? 3 : baseZoom() - 1.5;
      const want = Math.max(floor, baseZoom() - Math.max(0, Math.log2(J.speed / (0.6 * screenM))));
      const k = 1 - Math.pow(0.03, dt), kz = 1 - Math.pow(0.4, dt);
      J.zoom += Math.max(-0.8 * dt, Math.min(0.8 * dt, (want - J.zoom) * kz));   // 확대·축소는 천천히
      J.cam = [lonWrap(J.cam[0] + lonDiff(J.cam[0], head[0]) * k), J.cam[1] + (head[1] - J.cam[1]) * k];
      J.hopStart = J.zoom;
      }
    }
    if (!(jcfg.cam === 'auto' && !J.inHop)) jCamGo(J.cam);
  }
  J.prevHead = head;
  if (J.t >= jcfg.dur && !J.paused && !J.dragging) {
    if (!J.endAt) { J.endAt = now; jmap.getSource('j-old').setData(lines(P, 0, P.n - 1)); jmap.getSource('j-new').setData(EMPTY); jmap.getSource('j-head').setData(pointF(P.pts[P.n - 1])); jFit(P, 1200); }
    if (now - J.endAt > 2500) { jEnd(false); return; }
  }
  jmap.triggerRepaint();
  requestAnimationFrame(jTick);
}

function jYearButtons() {
  $('jYears').innerHTML = dataYears().map(y => `<button class="btn" data-y="${y}">${y}년</button>`).join('');
}
const fmtT = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
/** 재생 위치를 t초로 옮김 (앞뒤 어디로든). 카메라도 그 자리로 바로 옮깁니다. */
function jSeek(t) {
  const P = J.P;
  J.t = Math.max(0, Math.min(jcfg.dur, t)); J.endAt = 0;
  const target = P.W[P.n - 1] * (J.t / jcfg.dur);
  let i = 1; while (i < P.n - 1 && P.W[i] < target) i++;
  J.idx = i; J.oldUpto = -1;
  jmap.getSource('j-old').setData(EMPTY);
  if (jcfg.cam !== 'fixed') {
    const head = P.pts[i - 1];
    J.zoom = camZoom(P, i); J.hopStart = J.zoom; J.speed = 0; J.inHop = false;
    J.cam = jcfg.cam === 'auto' ? [...P.zones[P.zoneOf[i]].c] : [...head];
    J.prevHead = head;
    jCamGo(J.cam);
  }
}

function jEnd(aborted) {
  if (!J) return;
  const rec = J.rec;
  J = null;
  $('jPanel').classList.remove('hidden'); $('jCtl').classList.add('hidden');
  if (rec && rec.state !== 'inactive') { rec._aborted = aborted; rec.stop(); }
  if (aborted) jPreview(false);
}

// 영상으로 저장: 지도 그림 위에 제목 카드를 얹어 한 장씩 녹화합니다.
function recStart() {
  const src = jmap.getCanvas();
  const rc = document.createElement('canvas'); rc.width = src.width; rc.height = src.height;
  J.rc = rc; J.rctx = rc.getContext('2d');
  const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  const type = types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  const rec = new MediaRecorder(rc.captureStream(30), type ? { mimeType: type, videoBitsPerSecond: 8e6 } : {});
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    if (rec._aborted) { $('jMsg').textContent = '녹화를 멈췄어요.'; return; }
    const kind = (rec.mimeType || type).includes('mp4') ? 'mp4' : 'webm';
    const url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || type || 'video/webm' }));
    const a = document.createElement('a'); a.href = url; a.download = `mapory-${jcfg.from}_${jcfg.to}.${kind}`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    $('jMsg').textContent = `영상을 저장했어요 (${kind.toUpperCase()}). 다운로드 폴더를 확인해 주세요.`;
  };
  rec.start(500);
  J.rec = rec;
}
function jRecFrame() {
  if (!J || !J.rc) return;
  const src = jmap.getCanvas(), c = J.rctx, rc = J.rc;
  if (rc.width !== src.width || rc.height !== src.height) return;
  c.drawImage(src, 0, 0);
  const s = src.width / src.clientWidth;
  const t1 = $('jT1').textContent, t2 = $('jT2').textContent;
  c.font = `800 ${24 * s}px Pretendard, sans-serif`; const w1 = c.measureText(t1).width;
  c.font = `500 ${14 * s}px Pretendard, sans-serif`; const w2 = c.measureText(t2).width;
  const bw = Math.max(w1, w2) + 52 * s, bh = 76 * s, bx = (rc.width - bw) / 2, by = 20 * s;
  c.fillStyle = 'rgba(255,255,255,0.93)'; c.beginPath(); c.roundRect(bx, by, bw, bh, 18 * s); c.fill();
  c.textAlign = 'center'; c.fillStyle = '#111';
  c.font = `800 ${24 * s}px Pretendard, sans-serif`; c.fillText(t1, rc.width / 2, by + 34 * s);
  c.fillStyle = '#555'; c.font = `500 ${14 * s}px Pretendard, sans-serif`; c.fillText(t2, rc.width / 2, by + 60 * s);
  if (J.P.altMax && J.km != null) { const gw = Math.min(rc.width - 40 * s, 560 * s); drawProfile(c, (rc.width - gw) / 2, rc.height - 160 * s, gw, 70 * s, J.P, J.km, s); }
}

// ───────── 새 도구(tools.js)가 쓰는 공용 창구 ─────────
const TOOLS = {};
const CTX = {
  sb, $, esc, nf, fmtDist, fmtArea, fmtDate, fmtDayLabel, dayOf, addDays, decode, encodeLine, encodeNums, decodeNums, mercX, mercY, STYLE, ICON_NAMES, DOW, DEMO,
  makeMap, Fog, boundsOf, pUrl, firstPhoto, openMemory, fetchAll, go, TOOLS, total, fmtPct, bar, hours,
  get uid() { return uid; }, get days() { return days; }, get mems() { return mems; }, set mems(v) { mems = v; },
  get segs() { return segs; }, get summary() { return summary; }, get extra() { return extra; }, set extra(v) { extra = v; },
  get hasWebCols() { return hasWebCols; }, get hasExtra() { return hasExtra; }, get health() { return health; }, get hasHealth() { return hasHealth; }, renderDays, showTip, hideTip, STEP_GOAL,
  /** 기록이 바뀐 뒤 다른 화면들을 다시 그림 */
  refresh() { buildSegs(); renderHome(); renderAlbum(); if (map) { drawPins(); fog.draw(); } },
};

// ───────── 화면 전환 ─────────
function go(page) {
  document.querySelectorAll('nav button[data-page]').forEach(b => { if (b.dataset.page === page) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('hidden', p.id !== 'page-' + page));
  hideTip();
  // 숨겨져 있던 지도는 크기가 0이 되므로, 다시 보일 때 바로 크기를 맞춥니다.
  if (page === 'map') { if (!map) { initMap(); buildYearChips(); setView('all', null, null, false); } else { buildYearChips(); map.resize(); fog.draw(); } }
  if (page === 'journey') { if (!jmap) initJourney(); else { jmap.resize(); jYearButtons(); } }
  if (page === 'compare') { if (!cmp) initCompare(); else { cmp.A.map.resize(); cmp.B.map.resize(); applyCompare(); } }
  TOOLS[page]?.show?.();
}
document.querySelectorAll('nav button[data-page]').forEach(b => b.onclick = () => go(b.dataset.page));
$('brandHome').onclick = () => go('home');

// ───────── 로그인 ─────────
async function start(session) {
  uid = session.user.id;
  $('who').textContent = session.user.email;
  $('login').classList.add('hidden');
  $('loading').classList.remove('hidden');
  try { await loadData(); } catch (e) { $('loading').textContent = '기록을 불러오지 못했어요: ' + (e.message || e); return; }
  $('loading').classList.add('hidden');
  $('app').classList.remove('hidden');
  if (summary?.startTs) $('dplus').textContent = `함께한 지 D+${Math.floor((Date.now() - summary.startTs) / 864e5) + 1}`;
  buildFogPick();
  renderHome(); renderStats(); renderAlbum(); renderDays();
  try { (await import('./tools.js?v=7')).setup(CTX); } catch (e) { console.error('도구를 불러오지 못했어요', e); }
  try { (await import('./stats.js?v=2')).setup(CTX); } catch (e) { console.error('통계를 불러오지 못했어요', e); }
  try { (await import('./health.js?v=2')).setup(CTX); } catch (e) { console.error('헬스체크를 불러오지 못했어요', e); }
  go('home');
}

$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  $('loginErr').textContent = ''; $('loginBtn').disabled = true; $('loginBtn').textContent = '로그인 중…';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
  $('loginBtn').disabled = false; $('loginBtn').textContent = '로그인';
  if (error) { $('loginErr').textContent = error.status === 400 ? '이메일이나 비밀번호가 맞지 않아요.' : error.message; return; }
  $('pw').value = '';
  start(data.session);
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

if (DEMO) {
  start({ user: { id: 'demo', email: '시험용 화면' } });
} else {
  const { data: { session } } = await sb.auth.getSession();
  $('loading').classList.add('hidden');
  if (session) start(session); else $('login').classList.remove('hidden');
}
